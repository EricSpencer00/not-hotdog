[project]
name = "not-hotdog"
version = "0.1.0"
description = "Hot dog / not hot dog. A 136K-param int8 CNN that runs in the browser with zero dependencies."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0.9",
    "datasets>=3.0",
    "pillow>=10.4",
    "numpy>=1.26",
    "tqdm>=4.66",
    "requests>=2.32",
    "pandas>=2.2",
]

[tool.uv]
package = false
